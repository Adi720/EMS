{% extends "base.html" %}
{% load ui %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="ems-empty">
      <div class="ems-empty__icon">{% icon "check-circle" %}</div>
      <h1 class="ems-empty__title">Password changed</h1>
      <p class="ems-empty__text">Use your new password next time you log in.</p>
      <a class="btn btn-primary" href="{% url 'core:home' %}">Continue</a>
    </div>
  </div>
</div>
{% endblock %}
