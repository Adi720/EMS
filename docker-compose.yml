# Local development stack: PostgreSQL + Django dev server.
# Usage: copy .env.example to .env, then `docker compose up --build`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ems_seva
      POSTGRES_USER: ems_seva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_seva_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_seva"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://ems_seva:${POSTGRES_PASSWORD:-ems_seva_local}@db:5432/ems_seva
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
