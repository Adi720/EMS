{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="{% url 'core:manifest' %}">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="{% static 'img/icons/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/icons/apple-touch-icon.png' %}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMS Seva">
<script>
  // Apply the saved theme (or the device's preference) before the page is drawn.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("ems-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-bs-theme", theme);
  })();
</script>
<link rel="stylesheet" href="{% static 'vendor/inter/inter.css' %}">
<link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
